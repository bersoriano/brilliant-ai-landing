<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc" width="1200" height="750" viewBox="0 0 1200 750">
<title id="title">Seis puntos de partida para la arquitectura de IA</title><desc id="desc">Un mapa de decisión con seis combinaciones prácticas: muchos proveedores desconectados, capa de integración; un ERP dominante, sidecar; APIs modernas, orquestación con agentes; sistemas que solo tienen pantallas, RPA; información dispersa, RAG; trabajo de alto riesgo, aprobaciones acotadas.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2563EB" /></marker>
  <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#53637C" /></marker>
  <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#203559" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="750" fill="#F4F7FC"/>
<text x="600" y="60" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="32" font-weight="750" fill="#12213D">¿Qué enfoque de IA le queda a tu problema?</text><text x="600" y="97" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#53637C">Empieza por tu mayor restricción, no por la palabra de moda en IA.</text><rect x="398" y="120" width="404" height="70" rx="19" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.8"/><text x="600" y="160" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750" fill="#12213D">¿Qué está frenando a tu equipo?</text><path d="M600 190 V221 M205 221 H995" fill="none" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="210" y1="221" x2="210" y2="247" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="45" y="253" width="330" height="156" rx="20" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="61" y="271" width="298" height="33" rx="10" fill="#EAF1FF"/><text x="210" y="294" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="670" fill="#12213D">Muchos sistemas distintos</text><text x="210" y="351" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#2563EB">Capa de integración</text><text x="210" y="381" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#53637C">Conecta interfaces aprobadas</text><line x1="600" y1="221" x2="600" y2="247" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="435" y="253" width="330" height="156" rx="20" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="451" y="271" width="298" height="33" rx="10" fill="#E6F8FB"/><text x="600" y="294" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="670" fill="#12213D">Un ERP dominante</text><text x="600" y="351" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#0891B2">Sidecar de IA</text><text x="600" y="381" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#53637C">Amplía sin tocar el núcleo</text><line x1="990" y1="221" x2="990" y2="247" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="825" y="253" width="330" height="156" rx="20" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="841" y="271" width="298" height="33" rx="10" fill="#F3EAFF"/><text x="990" y="294" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="670" fill="#12213D">APIs modernas y confiables</text><text x="990" y="351" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#7C3AED">Orquestación con agentes</text><text x="990" y="381" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#53637C">Coordina los servicios que ya tienes</text><rect x="45" y="458" width="330" height="156" rx="20" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="61" y="476" width="298" height="33" rx="10" fill="#FFF4E8"/><text x="210" y="499" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="670" fill="#12213D">Sin APIs utilizables</text><text x="210" y="556" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#B45E14">RPA + computer use</text><text x="210" y="586" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#53637C">Trabaja desde la pantalla</text><rect x="435" y="458" width="330" height="156" rx="20" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="451" y="476" width="298" height="33" rx="10" fill="#E8F8F3"/><text x="600" y="499" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="670" fill="#12213D">Información dispersa</text><text x="600" y="556" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#087F6C">RAG + acceso a datos</text><text x="600" y="586" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#53637C">Encuentra y explica datos confiables</text><rect x="825" y="458" width="330" height="156" rx="20" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="841" y="476" width="298" height="33" rx="10" fill="#FFF4E8"/><text x="990" y="499" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="670" fill="#12213D">Decisiones de alto riesgo</text><text x="990" y="556" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#B45E14">Procesos acotados con IA</text><text x="990" y="586" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#53637C">Aprueban las personas</text><text x="600" y="660" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#53637C">Puede aplicar más de un recuadro. La arquitectura puede combinar estos patrones.</text><rect x="230" y="681" width="740" height="43" rx="19" fill="#E8F8F3"/><text x="600" y="708" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#087F6C">Para acciones delicadas: revisa accesos, verifica y pide aprobación.</text></svg>