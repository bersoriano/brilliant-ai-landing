<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc" width="1200" height="750" viewBox="0 0 1200 750">
<title id="title">Six starting points to AI architecture</title><desc id="desc">A decision map showing six practical matches: many disconnected vendors to integration layer; one dominant ERP to sidecar; modern APIs to agent orchestration; UI-only systems to RPA; fragmented information to RAG; high-stakes work to bounded approvals.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2563EB" /></marker>
  <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#53637C" /></marker>
  <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#203559" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="750" fill="#F4F7FC"/>
<text x="600" y="60" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="32" font-weight="750" fill="#12213D">Which AI approach fits the problem?</text><text x="600" y="97" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#53637C">Start with your biggest constraint—not the newest AI buzzword.</text><rect x="398" y="120" width="404" height="70" rx="19" fill="#EAF1FF" stroke="#2563EB" stroke-width="1.8"/><text x="600" y="160" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750" fill="#12213D">What is holding your team back?</text><path d="M600 190 V221 M205 221 H995" fill="none" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="210" y1="221" x2="210" y2="247" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="45" y="253" width="330" height="156" rx="20" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="61" y="271" width="298" height="33" rx="10" fill="#EAF1FF"/><text x="210" y="294" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="670" fill="#12213D">Many vendor systems</text><text x="210" y="351" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#2563EB">AI integration layer</text><text x="210" y="381" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#53637C">Connect approved interfaces</text><line x1="600" y1="221" x2="600" y2="247" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="435" y="253" width="330" height="156" rx="20" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="451" y="271" width="298" height="33" rx="10" fill="#E6F8FB"/><text x="600" y="294" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="670" fill="#12213D">One dominant ERP</text><text x="600" y="351" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#0891B2">AI sidecar</text><text x="600" y="381" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#53637C">Extend without altering core</text><line x1="990" y1="221" x2="990" y2="247" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="825" y="253" width="330" height="156" rx="20" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="841" y="271" width="298" height="33" rx="10" fill="#F3EAFF"/><text x="990" y="294" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="670" fill="#12213D">Reliable modern APIs</text><text x="990" y="351" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#7C3AED">Agent orchestration</text><text x="990" y="381" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#53637C">Coordinate existing services</text><rect x="45" y="458" width="330" height="156" rx="20" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="61" y="476" width="298" height="33" rx="10" fill="#FFF4E8"/><text x="210" y="499" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="670" fill="#12213D">No usable APIs</text><text x="210" y="556" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#B45E14">RPA + computer use</text><text x="210" y="586" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#53637C">Work through the interface</text><rect x="435" y="458" width="330" height="156" rx="20" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="451" y="476" width="298" height="33" rx="10" fill="#E8F8F3"/><text x="600" y="499" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="670" fill="#12213D">Scattered information</text><text x="600" y="556" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#087F6C">RAG + data access</text><text x="600" y="586" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#53637C">Find and explain trusted facts</text><rect x="825" y="458" width="330" height="156" rx="20" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="841" y="476" width="298" height="33" rx="10" fill="#FFF4E8"/><text x="990" y="499" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="670" fill="#12213D">High-stakes decisions</text><text x="990" y="556" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="23" font-weight="760" fill="#B45E14">Bounded AI workflows</text><text x="990" y="586" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#53637C">Keep approvals with people</text><text x="600" y="660" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#53637C">More than one box may apply. The architecture can combine these patterns.</text><rect x="230" y="681" width="740" height="43" rx="19" fill="#E8F8F3"/><text x="600" y="708" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#087F6C">For sensitive actions: check access, verify results, require approval.</text></svg>