<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc" width="1200" height="620" viewBox="0 0 1200 620">
<title id="title">AI sidecar next to dominant ERP</title><desc id="desc">A central ERP remains the system of record. An independently deployed AI sidecar analyzes data and prepares suggestions, with read and approved write interfaces between them.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2563EB" /></marker>
  <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#53637C" /></marker>
  <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#203559" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="620" fill="#F4F7FC"/>
<text x="600" y="62" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="32" font-weight="750" fill="#12213D">When one ERP runs almost everything</text><text x="600" y="100" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#53637C">Add intelligence alongside the core system, not deep inside it.</text><rect x="65" y="166" width="440" height="286" rx="22" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="95" y="192" width="380" height="54" rx="12" fill="#EAF1FF"/><text x="285" y="228" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="27" font-weight="730" fill="#12213D">Core ERP</text><text x="285" y="290" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#53637C">Inventory and orders</text><text x="285" y="328" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#53637C">Accounting and purchasing</text><text x="285" y="366" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#53637C">Authoritative business records</text><rect x="695" y="166" width="440" height="286" rx="22" fill="#FFFFFF" stroke="#0891B2" stroke-width="2" filter="url(#shadow)"/><rect x="725" y="192" width="380" height="54" rx="12" fill="#E6F8FB"/><text x="915" y="228" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="27" font-weight="730" fill="#12213D">AI sidecar</text><text x="915" y="290" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#53637C">Answers questions</text><text x="915" y="328" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#53637C">Prepares recommendations</text><text x="915" y="366" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#53637C">Drafts actions for approval</text><line x1="513" y1="275" x2="685" y2="275" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="687" y1="355" x2="515" y2="355" stroke="#53637C" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrowgray)"/><text x="600" y="260" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="680" fill="#2563EB">Read data</text><text x="600" y="344" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="15" font-weight="680" fill="#53637C">Approved actions</text><rect x="66" y="489" width="439" height="76" rx="15" fill="#EAF1FF"/><text x="285" y="520" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#12213D">ERP protects business rules</text><text x="285" y="547" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#53637C">and executes approved transactions</text><rect x="696" y="489" width="439" height="76" rx="15" fill="#E6F8FB"/><text x="915" y="520" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#12213D">AI adds a flexible experience</text><text x="915" y="547" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#53637C">without rewriting the ERP</text></svg>