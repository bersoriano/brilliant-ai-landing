<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc" width="1200" height="740" viewBox="0 0 1200 740">
<title id="title">Orquestación con agentes sobre APIs modernas</title><desc id="desc">Un objetivo del negocio llega a un orquestador de IA, que planea y usa las APIs de los servicios existentes. Los resultados pasan por las reglas del negocio y una aprobación humana antes de concretarse.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2563EB" /></marker>
  <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#53637C" /></marker>
  <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#203559" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="740" fill="#F4F7FC"/>
<text x="600" y="60" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="32" font-weight="750" fill="#12213D">Cuando tus aplicaciones tienen APIs confiables</text><text x="600" y="97" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#53637C">Deja que la IA coordine los pasos y que los servicios apliquen las reglas.</text><rect x="390" y="122" width="420" height="70" rx="16" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><text x="600" y="152" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="24" font-weight="720" fill="#12213D">Objetivo del negocio</text><text x="600" y="178" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#53637C">“Prepara el próximo pedido al proveedor”</text><line x1="600" y1="196" x2="600" y2="226" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="362" y="233" width="476" height="108" rx="20" fill="#EAF1FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/><text x="600" y="276" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="27" font-weight="750" fill="#12213D">Orquestador de IA</text><text x="600" y="308" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#53637C">Planea pasos • Elige herramientas • Revisa resultados</text><path d="M600 341 V374 M200 374 H1000" fill="none" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="200" y1="374" x2="200" y2="398" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="47" y="407" width="306" height="94" rx="14" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><text x="200" y="442" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="22" font-weight="720" fill="#12213D">API del CRM</text><text x="200" y="472" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#53637C">Necesidades del cliente</text><line x1="600" y1="374" x2="600" y2="398" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="447" y="407" width="306" height="94" rx="14" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><text x="600" y="442" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="22" font-weight="720" fill="#12213D">API de inventario</text><text x="600" y="472" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#53637C">Existencias</text><line x1="1000" y1="374" x2="1000" y2="398" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="847" y="407" width="306" height="94" rx="14" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><text x="1000" y="442" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="22" font-weight="720" fill="#12213D">API de pedidos</text><text x="1000" y="472" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#53637C">Borradores de compra</text><path d="M200 502 V528" fill="none" stroke="#53637C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" /><path d="M600 502 V528" fill="none" stroke="#53637C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" /><path d="M1000 502 V528" fill="none" stroke="#53637C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" /><path d="M200 528 H1000 M600 528 V557" fill="none" stroke="#53637C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><rect x="345" y="560" width="510" height="70" rx="16" fill="#FFF4E8"/><text x="600" y="588" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="22" font-weight="720" fill="#12213D">Reglas del negocio + aprobación</text><text x="600" y="615" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#53637C">Políticas, permisos, excepciones y bitácora</text><line x1="600" y1="631" x2="600" y2="659" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="365" y="666" width="470" height="48" rx="14" fill="#E8F8F3"/><text x="600" y="697" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#087F6C">Acción aprobada en el sistema de origen</text></svg>