<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="title desc" width="1200" height="690" viewBox="0 0 1200 690">
<title id="title">AI integration layer across different legacy vendors</title><desc id="desc">Requests reach an AI integration layer, which calls approved adapters for ERP, CRM, warehouse and finance systems. All four systems remain the sources of truth.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#2563EB" /></marker>
  <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#53637C" /></marker>
  <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#203559" flood-opacity="0.08"/></filter>
</defs>
<rect width="1200" height="690" fill="#F4F7FC"/>
<text x="600" y="60" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="32" font-weight="750" fill="#12213D">When different systems do not talk easily</text><text x="600" y="95" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500" fill="#53637C">An AI integration layer coordinates the work without replacing existing applications.</text><rect x="410" y="123" width="380" height="76" rx="16" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><text x="600" y="155" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="24" font-weight="680" fill="#12213D">People and business requests</text><text x="600" y="179" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#53637C">“Show overdue orders and missing stock”</text><line x1="600" y1="201" x2="600" y2="240" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="332" y="249" width="536" height="129" rx="22" fill="#EAF1FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/><text x="600" y="295" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="28" font-weight="750" fill="#12213D">AI integration layer</text><text x="600" y="329" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#53637C">Answers questions • Coordinates tasks • Checks permissions</text><text x="600" y="353" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#2563EB">Uses a controlled set of approved tools</text><path d="M600 378 V409 M155 409 H1045" fill="none" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="180" y1="409" x2="180" y2="437" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="60" y="445" width="240" height="120" rx="16" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="76" y="460" width="42" height="42" rx="10" fill="#E6F8FB"/><text x="97" y="487" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0891B2">▦</text><text x="180" y="489" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#12213D">ERP</text><text x="180" y="533" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#53637C">Orders &amp; inventory</text><line x1="460" y1="409" x2="460" y2="437" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="340" y="445" width="240" height="120" rx="16" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="356" y="460" width="42" height="42" rx="10" fill="#E6F8FB"/><text x="377" y="487" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0891B2">▦</text><text x="460" y="489" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#12213D">CRM</text><text x="460" y="533" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#53637C">Customers</text><line x1="740" y1="409" x2="740" y2="437" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="620" y="445" width="240" height="120" rx="16" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="636" y="460" width="42" height="42" rx="10" fill="#E6F8FB"/><text x="657" y="487" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0891B2">▦</text><text x="740" y="489" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#12213D">Warehouse</text><text x="740" y="533" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#53637C">Shipments</text><line x1="1020" y1="409" x2="1020" y2="437" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="900" y="445" width="240" height="120" rx="16" fill="#FFFFFF" stroke="#CBD7E7" stroke-width="1.5" filter="url(#shadow)"/><rect x="916" y="460" width="42" height="42" rx="10" fill="#E6F8FB"/><text x="937" y="487" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0891B2">▦</text><text x="1020" y="489" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#12213D">Finance</text><text x="1020" y="533" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="500" fill="#53637C">Invoices &amp; billing</text><rect x="260" y="596" width="680" height="52" rx="25" fill="#E8F8F3"/><text x="600" y="629" text-anchor="middle" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#087F6C">Existing applications continue to own their records and transactions.</text></svg>